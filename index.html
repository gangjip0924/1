<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>자바스크립트</h1>

    <div id="login-section">
        <h2>로그인</h2>
        <input type="text" id="username-input" placeholder="이름을 입력하세요">
        <button id="login-button">로그인</button>
    </div>
    <div id="welcome-section" style="display: none;">
        <h2 id="welcome-message"></h2>
        <button id="logout-button">로그아웃</button>
    </div>

    <div>
        <h2>댓글 남기기</h2>
        <input type="text" id="comment-input" placeholder="댓글을 입력하세요" disabled>
        <button id="comment-button" disabled>댓글 추가</button>
        <ul id="comment-list"></ul>
    </div>
 <script src="./script.js"></script>
</body>
</html>
